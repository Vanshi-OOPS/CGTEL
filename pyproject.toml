[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cgtel"
version = "0.1.0"
description = "Confidence-Gated Tool Execution Layer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["cgtel/tests"]
